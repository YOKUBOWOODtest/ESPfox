<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Whiteboard Mod</title>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 2rem; background: #fafafa; }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #e0533f; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 2rem auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>Whiteboard Mod</h1>
  <p>Redirecting to the board server...</p>
  <div class="spinner"></div>
  <script>
    // GitHub Pages serves this 404.html for unknown routes
    // Redirect board routes to the Render server
    (function() {
      var path = window.location.pathname + window.location.search + window.location.hash;
      var renderUrl = 'https://whiteboardmod.onrender.com'; // UPDATE THIS after first Render deploy
      
      if (path.startsWith('/board/')) {
        window.location.href = renderUrl + path;
      } else {
        // Show a friendly 404 for non-board routes
        document.body.innerHTML = `
          <h1>404 - Page Not Found</h1>
          <p>The page you're looking for doesn't exist.</p>
          <a href="${renderUrl}" style="color: #e0533f;">Go to Whiteboard Mod</a>
        `;
      }
    })();
  </script>
</body>
</html>
